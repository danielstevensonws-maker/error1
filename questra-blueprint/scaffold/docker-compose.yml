# Dev infrastructure (ADR-0015). Local Postgres for the durable event log +
# entity persistence. `docker compose up -d` then run migrations.
#
# This is the LOCAL DEV database only. Production deploy (M8) provisions its own
# managed Postgres; the app reads DATABASE_URL either way (no code difference).

services:
  postgres:
    image: postgres:16-alpine
    container_name: questra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: questra
      POSTGRES_PASSWORD: questra_dev
      POSTGRES_DB: questra
    ports:
      - "5432:5432"
    volumes:
      - questra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questra -d questra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  questra_pgdata:
